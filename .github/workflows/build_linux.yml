name: Build AppImage

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Activer pnpm
        run: corepack enable pnpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances JS
        run: pnpm install --frozen-lockfile

      - name: Build AppImage
        run: pnpm tauri build --bundles appimage
        env:
          NO_STRIP: "true" # évite l'échec de linuxdeploy sur les binutils récents

      - name: Artefact
        uses: actions/upload-artifact@v4
        with:
          name: pieride-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Release (sur tag uniquement)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/appimage/*.AppImage
