name: Build Linux (flatpak)

on:
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          # --- ANCIEN - BUILD ARM CONSERVÉ ---
          # - arch: arm64
          #   runner: ubuntu-24.04-arm
          #   rust_target: aarch64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.arch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps + flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.gnome.Platform//47 org.gnome.Sdk//47
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build (deb)
        run: |
          pnpm tauri build --target ${{ matrix.rust_target }} --bundles deb
          cp src-tauri/target/${{ matrix.rust_target }}/release/bundle/deb/*.deb flatpak/pieride.deb
          dpkg -c flatpak/pieride.deb

      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir flatpak/com.pieride.Pieride.yml
          flatpak build-bundle repo Pieride-${{ matrix.arch }}.flatpak com.pieride.Pieride --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo

      - name: Upload artifact ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: Pieride-Linux-${{ matrix.arch }}
          path: |
            src-tauri/target/**/bundle/deb/*.deb
            *.flatpak
            # --- ANCIENS PATHS CONSERVÉS ---
            # src-tauri/target/**/bundle/appimage/*.AppImage
            # src-tauri/target/**/bundle/deb/*.deb
            # src-tauri/target/**/bundle/rpm/*.rpm
          if-no-files-found: error
